<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYNTA Loyalty &bull; Plataforma SaaS de Fidelizaci&oacute;n Digital</title>
  
  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" href="./assets/img/logo-circle.png" />
  <link rel="apple-touch-icon" href="./assets/img/logo-circle.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#090A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Plataforma SaaS Multi-Tenant de Fidelizaci&oacute;n Digital, Tarjetas de Sellos y Cupones para Negocios F&iacute;sicos" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              500: '#0EA5E9',
              600: '#0284C7',
              900: '#0C4A6E'
            }
          }
        }
      }
    }
  </script>

  <!-- External Libraries (QR Generation, Camera Scanner, Confetti) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./assets/css/styles.css?v=3.2" />
  <script>
    (function() {
      var saved = localStorage.getItem('vynta_theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    })();
  </script>
</head>
<body class="bg-[#090A0F] text-zinc-100 min-h-screen selection:bg-sky-500 selection:text-black">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Clear outdated cache & Register updated SW -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let r of registrations) {
          r.unregister();
        }
      });
    }
  </script>

  <!-- Main ES Module Entry Point with cache buster -->
  <script type="module" src="./assets/js/app.js?v=3.2"></script>
</body>
</html>
